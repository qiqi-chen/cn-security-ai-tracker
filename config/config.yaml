collector:
  concurrency: 5
  timeout: 30
  retry_times: 3
  retry_delay: 2.0
  proxy: ""
  user_agent: "Mozilla/5.0 (compatible; cn-security-ai-tracker/0.1)"
  time_range: month

sources:
  rss:
    enabled: true
    feeds:
      - name: 安全客
        url: https://api.anquanke.com/data/v1/rss
        scrape_full_content: false
      - name: 嘶吼
        url: https://www.4hou.com/feed
        scrape_full_content: false
      - name: 安全脉搏
        url: https://www.secpulse.com/feed
        scrape_full_content: false
      - name: 绿盟科技博客
        url: https://blog.nsfocus.net/feed/
        scrape_full_content: false
  company_website:
    enabled: true
    timeout: 20
  playwright:
    enabled: false
    headless: true
    timeout: 30

processor:
  min_content_length: 50
  min_quality_score: 0.3
  dedup_db_path: data/cache/news_cache.db
  dedup_retention_days: 90

enhancer:
  enabled: false
  model: deepseek-chat
  base_url: https://api.deepseek.com
  max_tokens: 300
  temperature: 0.3
  concurrency: 5
  cache_db_path: data/cache/llm_cache.db

analyzer:
  trend_window_days: 7
  trend_threshold: 0.5
  top_keywords_count: 20

reporter:
  max_news_per_company: 5
  sort_by: quality
  include_empty_companies: false

exporter:
  targets:
    - markdown
  output_dir: output/
  feishu:
    enabled: false
    cli_bin: feishu
    folder_token: ""
    notify_webhook: ""
  dingtalk:
    enabled: false
    cli_bin: dingtalk
    notify_webhook: ""
    doc_space_id: ""

logging:
  level: INFO
  format: json
  file: ""
